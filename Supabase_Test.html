  <title>Verge3D Web Interactive</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <!-- Search Engines -->

  <!-- Twitter -->

  <!-- Open Graph -->
  <meta property="og:title" content="Verge3D Web Interactive">

  <meta name="theme-color" content="#ffffff">

  <!-- Модальное окно управления станком (появляется по клику на пилораму) -->
<div id="saw-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modal-saw-name">SM_Saw_01</h2>
      <button id="close-modal-btn" class="close-btn">&times;</button>
    </div>

    <div id="modal-status-badge" class="status-badge">Статус: Работает</div>

    <!-- Кнопки остановки (видны, если станок работает) -->
    <div id="stop-controls" class="controls-group">
      <p class="controls-label">Остановить станок. Укажите причину:</p>
      <button class="action-btn btn-saw" data-reason="Замена пил">Замена пил</button>
      <button class="action-btn btn-repair" data-reason="Ремонт">Ремонт</button>
      <button class="action-btn btn-idle" data-reason="Простой">Простой</button>
    </div>

    <!-- Кнопка запуска (видна, если станок остановлен) -->
    <div id="start-controls" class="controls-group hidden">
      <p id="current-reason-text" class="controls-label">Причина: —</p>
      <button id="btn-start-saw" class="action-btn btn-run">Запустить станок</button>
    </div>
  </div>
</div>

  <script src="v3d.js"></script>
  <script src="Supabase_Test.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" type="text/css" href="Supabase_Test.css">

    <div id="fullscreen-button" class="fullscreen-button fullscreen-open" title="Toggle fullscreen mode"></div>
  </div>

  <!-- Панель краткой статистики в углу экрана -->
<div id="stats-panel" class="stats-panel">
  <div class="stats-title">Статистика простоев (сегодня)</div>
  <div id="stats-content">Загрузка...</div>
</div>



</body>

</html>
